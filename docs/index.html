<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="קיטו וכוח">
<meta name="theme-color" content="#131110">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>body{margin:0;padding-top:env(safe-area-inset-top,0px)}[hidden]{display:none!important}</style>
<title>יומן קיטו וכוח</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Karantina:wght@400;700&display=swap">
<style>
/* Layout: one phone-width column of quiet cards, sticky header, fixed bottom tabs; scoreboard numerals carry the data. */
:root{
  --bg:#131110; --surface:#1c1917; --raised:#272320; --line:#3a342e;
  --fg:#f3eee6; --muted:#a69d91; --faint:#756c62;
  --yolk:#f0b23e; --yolk-ink:#291b02; --rare:#e4745e; --ok:#86c98a; --bad:#e4745e;
  --font-display:'Karantina','Heebo',system-ui,sans-serif;
  --font-body:'Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --r:16px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{
  color:var(--fg); font-family:var(--font-body); font-size:15px; line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--yolk);outline-offset:2px}
#app{max-width:560px;margin-inline:auto;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
#view{display:flex;flex-direction:column;gap:12px}
[dir="ltr"],bdi{unicode-bidi:isolate}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{font-family:var(--font-display);font-size:30px;line-height:1;font-weight:700;letter-spacing:.5px}
.brand span{color:var(--yolk)}
.top-side{display:flex;align-items:center;gap:8px}
.save{font-size:12px;color:var(--muted);padding:4px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.save[data-s="saved"],.save[data-s="local"]{color:var(--ok)}
.save[data-s="error"]{color:var(--bad);border-color:var(--bad)}
.tchip{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;padding:4px 10px;border-radius:999px;border:0;background:var(--yolk);color:var(--yolk-ink)}
.tchip.done{animation:pulse .6s ease-in-out infinite alternate}

/* date navigation */
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav-t{flex:1;min-width:0;text-align:center}
.nav-t h2{font-size:17px;font-weight:700;text-wrap:balance}
.nav-t button{margin-top:2px;background:none;border:0;color:var(--yolk);font-size:13px;padding:2px 8px}
.ico{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.ico svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;border-radius:14px;border:1px solid transparent;background:var(--surface);min-width:0}
.wd-l{font-size:12px;color:var(--muted)}
.wd-n{font-size:19px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.wd .dot{width:5px;height:5px;border-radius:50%;background:transparent}
.wd .dot.on{background:var(--yolk)}
.wd.is-today{border-color:var(--line)}
.wd.is-sel{background:var(--yolk);color:var(--yolk-ink)}
.wd.is-sel .wd-l{color:var(--yolk-ink)}
.wd.is-sel .dot.on{background:var(--yolk-ink)}

/* cards */
.card{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.card-h h3{font-size:16px;font-weight:700}
.hint{font-size:12px;color:var(--muted)}
.mt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.lbl{font-size:12px;color:var(--muted);letter-spacing:.02em}
.lbl .todo{color:var(--yolk)}
.grp{display:flex;flex-direction:column;gap:6px}
.sec-h{font-family:var(--font-display);font-size:28px;line-height:1;font-weight:700;letter-spacing:.5px;margin-top:8px}

/* summary */
.sum{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.meter{display:flex;flex-direction:column;gap:6px}
.meter-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.meter-n{display:flex;align-items:baseline;gap:5px;font-variant-numeric:tabular-nums}
.meter-n b{font-size:28px;line-height:1;font-weight:700;letter-spacing:-.01em}
.meter-n i{font-style:normal;color:var(--muted);font-size:14px}
.meter-n small{color:var(--muted);font-size:12px}
.track{height:8px;border-radius:999px;background:var(--raised);overflow:hidden;direction:rtl}
.track.thin{height:4px}
.fill{height:100%;width:0;border-radius:999px;transition:width .3s ease}
.fill.k{background:var(--yolk)}
.fill.p{background:var(--rare)}
.win{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.win-v{font-variant-numeric:tabular-nums;font-weight:500}
.win-d{color:var(--muted);font-size:13px;font-weight:400}
.faint{color:var(--faint)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--raised);font-weight:500;text-align:center;line-height:1.25}
.chip small{display:block;font-size:10px;font-weight:400;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--yolk);border-color:var(--yolk);color:var(--yolk-ink)}
.chip[aria-pressed="true"] small{color:var(--yolk-ink)}
.chip.is-default:not([aria-pressed="true"]){border-style:dashed;border-color:var(--yolk)}
.seg4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg4 .chip{border-radius:12px}
.eggs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.eggs .chip{border-radius:12px;font-size:22px;font-weight:700;line-height:1.1;padding:8px 4px}
.eggs .chip small{margin-top:2px}
.link{background:none;border:0;color:var(--yolk);font-size:13px;padding:6px 4px}

/* habits */
.habit{display:flex;align-items:center;gap:12px;min-height:48px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--raised);text-align:start;width:100%}
.habit .box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--faint);display:grid;place-items:center}
.habit .box svg{width:14px;height:14px;stroke:var(--bg);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.habit[aria-pressed="true"]{border-color:var(--ok)}
.habit[aria-pressed="true"] .box{background:var(--ok);border-color:var(--ok)}
.habit[aria-pressed="true"] .box svg{opacity:1}
.habit span.t{flex:1;min-width:0}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap}

/* inputs */
input[type="number"],input[type="time"],input[type="date"],textarea{
  background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:16px;min-height:44px;min-width:0;
  font-variant-numeric:tabular-nums;
}
input[type="number"]{direction:ltr;text-align:center;-moz-appearance:textfield;appearance:textfield}
input[type="number"]::-webkit-outer-spin-button,input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input::placeholder,textarea::placeholder{color:var(--faint)}
textarea{width:100%;resize:vertical;text-align:start}
.time-row{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.time-row label{font-size:13px;color:var(--muted)}
.time-row input{direction:ltr;width:128px}
.ghost{min-height:44px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:none;font-size:13px}
.btn{min-height:44px;padding:8px 16px;border-radius:12px;border:0;background:var(--yolk);color:var(--yolk-ink);font-weight:700;display:inline-grid;place-items:center;text-align:center}
.btn.alt{background:var(--raised);color:var(--fg);border:1px solid var(--line);font-weight:500}

/* food items */
.frow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--yolk);background:var(--raised)}
.fname{font-weight:500;min-width:0}
.fname small{display:block;font-size:12px;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.stp{display:inline-flex;align-items:center;gap:2px}
.stp button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1}
.stp b{min-width:36px;text-align:center;font-size:18px;font-variant-numeric:tabular-nums}
.stp input{width:56px;padding-inline:2px;font-size:18px;font-weight:700}
.fmeta{grid-column:1/-1;display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;font-size:12px;color:var(--muted)}
.fmeta input{width:84px}
.eggstep{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* workout */
.timer{position:sticky;top:calc(env(safe-area-inset-top,0px) + 50px);z-index:5;background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;display:grid;grid-template-columns:62px repeat(3,minmax(0,1fr)) 44px;gap:6px;align-items:center}
.timer-n{font-size:24px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums;color:var(--faint);text-align:center}
.timer.run .timer-n{color:var(--yolk)}
.timer.done{border-color:var(--ok);animation:pulse .6s ease-in-out infinite alternate}
.timer.done .timer-n{color:var(--ok);font-size:18px}
.timer button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:14px;padding:4px;display:grid;place-items:center}
.timer button svg{width:14px;height:14px;fill:currentColor}
.timer .track{grid-column:1/-1}
@keyframes pulse{from{opacity:1}to{opacity:.55}}
.ex{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.ex-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ex-h h4{font-size:15px;font-weight:700;line-height:1.3}
.ex-h .en{display:block;font-size:12px;color:var(--muted);font-weight:400}
.demo{flex:none;min-height:36px;display:inline-grid;place-items:center;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--fg);text-decoration:none;font-size:12px;white-space:nowrap}
.ex-m{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;font-size:12px;color:var(--muted)}
.ex-m .target{font-size:16px;font-weight:700;line-height:1.2;color:var(--yolk)}
.ex-c{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{min-height:40px;padding:4px 12px;border:0;background:none;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--yolk);font-weight:700}
.last{font-size:12px;color:var(--muted)}
.sets{display:flex;flex-direction:column;gap:6px}
.set,.set-head{display:grid;grid-template-columns:20px minmax(0,1fr) minmax(0,1fr) minmax(0,1.15fr) 44px;gap:6px;align-items:center}
.set.one,.set-head.one{grid-template-columns:20px minmax(0,1fr) minmax(0,1.15fr) 44px}
.set-head{font-size:11px;color:var(--muted);text-align:center}
.set .n{font-size:14px;font-weight:700;color:var(--muted);text-align:center}
.set input{width:100%;padding-inline:4px}
.hb{font-size:11px;line-height:1.25;color:var(--muted);text-align:center;min-width:0}
.hb b{display:block;font-size:13px;color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
.hb.ph b{color:var(--faint)}
.ok{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:none;display:grid;place-items:center}
.ok svg{width:16px;height:16px;stroke:var(--faint);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ok[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.ok[aria-pressed="true"] svg{stroke:var(--bg)}
.set-more{display:flex;flex-wrap:wrap;gap:8px}
.set-more .ghost{color:var(--muted)}
.add-ex{min-height:44px;border-radius:12px;border:1px dashed var(--line);background:none;color:var(--yolk);font-size:14px;padding:8px 12px}

/* weigh-ins */
.wform{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:8px}
.wform .f{display:flex;flex-direction:column;gap:4px;min-width:0}
.wform input{width:100%}
.wform input[type="date"]{direction:ltr}
.wform .btn{grid-column:1/-1}
.big{display:flex;align-items:baseline;gap:6px}
.big b{font-size:56px;line-height:.95;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big span{color:var(--muted)}
.deltas{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.deltas b{color:var(--fg);font-variant-numeric:tabular-nums}
.deltas b.up{color:var(--ok)} .deltas b.down{color:var(--rare)}
.chart{width:100%;height:auto;display:block}
.wlist{display:flex;flex-direction:column}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding-block:8px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.wweek+.wrow{border-top:0}
.wweek{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:baseline;margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--raised);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.wweek:first-child{margin-top:0}
.wweek b{color:var(--fg);font-size:15px}
.wweek .dl{min-width:36px;text-align:center}
.bal{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--raised)}
.bal b{font-size:16px}
.bal span{font-size:13px;line-height:1.45;color:var(--muted)}
.bal-ok{border-color:var(--ok)} .bal-ok b{color:var(--ok)}
.bal-warn{border-color:var(--yolk)} .bal-warn b{color:var(--yolk)}
.wrow .d{color:var(--muted);font-size:13px}
.wrow .ghost{min-height:36px;padding:2px 10px;font-size:12px}
.msg{font-size:13px;color:var(--muted)}
.msg.err{color:var(--bad)}

/* weekly */
.tbl{overflow-x:auto;background:var(--surface);border-radius:var(--r)}
.wk{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
.wk th{font-size:11px;font-weight:500;color:var(--muted);padding:10px 4px 6px;text-align:center;white-space:nowrap}
.wk td{padding:8px 4px;text-align:center;border-top:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.wk td:first-child,.wk th:first-child{padding-inline-start:10px}
.wk td:last-child,.wk th:last-child{padding-inline-end:10px}
.wk tr.is-today td{background:var(--raised)}
.wk tfoot td{font-weight:700;border-top:2px solid var(--line)}
.wk small{display:block;font-size:10px;color:var(--muted);font-weight:400}
.dayb{background:none;border:0;display:inline-flex;align-items:baseline;gap:4px;min-height:36px;padding:2px 4px}
.dayb b{font-size:15px;font-weight:700;line-height:1}
.dayb span{font-size:11px;color:var(--muted)}
.hd{display:inline-flex;gap:3px}
.hd i{font-style:normal;width:16px;height:16px;border-radius:50%;border:1px solid var(--line);font-size:9px;line-height:14px;color:var(--faint)}
.hd i.on{background:var(--ok);border-color:var(--ok);color:var(--bg);font-weight:700}
.ins{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ins li{position:relative;padding-inline-start:16px;font-size:14px;line-height:1.45}
.ins li::before{content:"";position:absolute;inset-inline-start:0;top:.5em;width:8px;height:8px;border-radius:50%;background:var(--faint)}
.ins li.ins-ok::before{background:var(--ok)}
.ins li.ins-warn::before{background:var(--yolk)}
.prog{display:flex;flex-direction:column}
.prow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-block:7px;border-top:1px solid var(--line);font-size:13px}
.prow:first-child{border-top:0}
.prow span{min-width:0}
.prow b{font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--muted)}
.prow b.p-up{color:var(--ok)} .prow b.p-down{color:var(--rare)}
.row-btns{display:flex;flex-wrap:wrap;gap:8px}
.row-btns>*{flex:1 1 130px}
details summary{cursor:pointer;color:var(--muted);font-size:13px;min-height:32px}
details[open] summary{margin-bottom:8px}

/* bottom tabs */
.tabs{position:fixed;inset:auto 0 0 0;z-index:9;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:560px;margin-inline:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;padding:6px 2px;border:0;border-radius:12px;background:none;color:var(--muted);font-size:12px}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.is-on{color:var(--yolk);background:var(--raised);font-weight:700}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div id="app" dir="rtl" lang="he">
  <header class="top">
    <div class="brand">קיטו <span>וכוח</span></div>
    <div class="top-side">
      <button class="tchip" id="tchip" data-act="timer-stop" hidden aria-label="עצירת טיימר מנוחה"></button>
      <span class="save" id="save" data-s="saved" role="status" aria-live="polite">נשמר ✓</span>
    </div>
  </header>
  <main id="view"></main>
  <nav class="tabs" aria-label="ניווט ראשי">
    <div class="tabs-in">
      <button class="tab" data-act="tab" data-v="daily"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v17H5z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>יומן יומי</button>
      <button class="tab" data-act="tab" data-v="weigh"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 9.5a5 5 0 0 1 7 0M12 9v2.5"/></svg>מעקב משקל</button>
      <button class="tab" data-act="tab" data-v="week"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg>סיכום שבועי</button>
    </div>
  </nav>
</div>

<script>
(function(){
'use strict';
document.documentElement.setAttribute('dir','rtl');
document.documentElement.setAttribute('lang','he');

/* ---------- helpers ---------- */
var $ = function(s,r){ return (r||document).querySelector(s); };
var ESC = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return ESC[c];}); }
function pad(n){ return String(n).padStart(2,'0'); }
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }

function hm2min(t){ if(!/^\d{1,2}:\d{2}$/.test(t||'')) return null; var a=t.split(':'); return (+a[0])*60+(+a[1]); }

  if(!ts.length) return null;

/* Until 2026-11-24 the incline press was a standard part of day A, right after the bench press.

var INCLINE_OPT='2026-11-25';

/* An exercise added to the plan later (from) is not expected on earlier days unless it was logged there. */
function exList(d,date){
  var w=WORKOUTS[d.type]; if(!w) return [];
  var out=[];
  w.ex.forEach(function(e){
    if(e.from&&date&&date<e.from&&!d.workout.ex[e.id]) return;
    out.push(e);
  });
  if(d.type==='A'&&inclineOn(d,date)){
    var at=out.indexOf(EX_BY_ID.pecdeck); if(at<0) at=out.indexOf(EX_BY_ID.bench);

/* Rows shown for an exercise: the planned sets, plus any extra sets added or logged that day. */

}

  list.forEach(function(e){
    var r=d.workout.ex[e.id], n=0;

  if(!d) return false; d=norm(d);

  if(d.habits.salt||d.habits.mag||d.habits.creatine) return true;
  if(mealLogged(d,'shake')||mealLogged(d,'lunch')||mealLogged(d,'dinner')||mealLogged(d,'snack')) return true;
  for(var k in d.workout.ex){ var r=d.workout.ex[k]; if(r&&Array.isArray(r.sets)&&r.sets.some(setLogged)) return true; }
  return false;
}

/* ---------- workout helpers ---------- */
function defUnit(ex){ return ex.kind==='pin'?'lb':'kg'; }
function exUnit(ex,d){ var r=d.workout.ex[ex.id]; return (r&&r.u)||(meta.ex[ex.id]&&meta.ex[ex.id].u)||defUnit(ex); }
function exBar(ex,d){ var r=d.workout.ex[ex.id]; var b=(r&&r.bar)||(meta.ex[ex.id]&&meta.ex[ex.id].bar)||20; return b===15?15:20; }

function conv(w,from,to){
  var n=toNum(w); if(isNaN(n)||from===to) return w;
  return to==='lb'?String(Math.round(n*2.20462)):String(Math.round(n*0.453592*2)/2);
}
function lastSession(exId,date){
  var keys=Object.keys(days).sort();
  for(var i=keys.length-1;i>=0;i--){
    var k=keys[i]; if(k>=date) continue;
    var w=days[k]&&days[k].workout, r=w&&w.ex&&w.ex[exId];
    if(r&&Array.isArray(r.sets)&&r.sets.some(setLogged)) return {date:k,u:r.u,sets:r.sets};
  }

}
function placeholders(ex,unit,last,i){
  var w='', r='';
  if(last){
    var s=last.sets[i]; if(!setLogged(s)){ for(var j=last.sets.length-1;j>=0;j--){ if(setLogged(last.sets[j])){ s=last.sets[j]; break; } } }
    if(s){ r=String(s.r); w=(s.w===''||s.w==null)?'':conv(String(s.w),last.u||defUnit(ex),unit); }
  }
  if(w===''&&ex.defW&&unit==='kg') w=ex.defW;
  return {w:w,r:r};
}
function needsW(ex){ return ex.kind!=='time'&&ex.kind!=='body'; }
function hintFor(ex,unit,bar,wv){
  var w=toNum(wv); if(isNaN(w)) return null;
  if(ex.kind==='barbell'){
    var b=unit==='lb'?Math.round(bar*2.20462):bar, side=(w-b)/2;
    if(side<0) return null;
    return {l:'כל צד',v:trim(side)+' '+uLabel(unit)};
  }
  if(ex.kind==='plate') return {l:'כל צד',v:trim(w/2)+' '+uLabel(unit)};
  if(unit==='lb') return {l:'',v:'≈ '+(Math.round(w*0.453592*10)/10)+' ק״ג'};
  if(ex.kind==='pin') return {l:'',v:'≈ '+Math.round(w*2.20462)+' <bdi dir="ltr">lbs</bdi>'};
  return null;
}
function hintHtml(ex,unit,bar,val,ph){

function ensureRec(d,ex,min){
  var r=d.workout.ex[ex.id], need=Math.max(ex.sets,Math.min(MAX_SETS,min||0));
  if(!r||typeof r!=='object'){ r=d.workout.ex[ex.id]={u:exUnit(ex,d),sets:[]}; if(ex.kind==='barbell') r.bar=exBar(ex,d); }
  if(!Array.isArray(r.sets)) r.sets=[];
  while(r.sets.length<need) r.sets.push({w:'',r:''});
  for(var i=0;i<r.sets.length;i++){ if(!r.sets[i]||typeof r.sets[i]!=='object') r.sets[i]={w:'',r:''}; }

/* ---------- rest timer ---------- */
var T={end:0,total:0,iv:null,done:false,ctx:null,doneTo:null};
function clock(s){ return Math.floor(s/60)+':'+pad(s%60); }
function startTimer(sec){
  try{ var AC=window.AudioContext||window.webkitAudioContext; if(AC){ T.ctx=T.ctx||new AC(); if(T.ctx.state==='suspended') T.ctx.resume(); } }catch(e){}
  clearTimeout(T.doneTo); clearInterval(T.iv);
  T.total=sec; T.end=Date.now()+sec*1000; T.done=false; T.iv=setInterval(tick,250); paintTimer();
}
function stopTimer(){ clearInterval(T.iv); clearTimeout(T.doneTo); T.iv=null; T.end=0; T.done=false; paintTimer(); }
function tick(){
  if(T.end&&Date.now()>=T.end){
    clearInterval(T.iv); T.iv=null; T.end=0; T.done=true; timerAlert();
    T.doneTo=setTimeout(function(){ T.done=false; paintTimer(); },10000);
  }
  paintTimer();
}
function timerAlert(){
  try{
    var c=T.ctx; if(c){ var t0=c.currentTime;
      [0,0.3,0.6].forEach(function(o,i){
        var os=c.createOscillator(), g=c.createGain(); os.type='sine'; os.frequency.value=i===2?1175:880;
        g.gain.setValueAtTime(0.0001,t0+o); g.gain.exponentialRampToValueAtTime(0.4,t0+o+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+o+0.24);
        os.connect(g); g.connect(c.destination); os.start(t0+o); os.stop(t0+o+0.26);
      });
    }
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate([200,100,200,100,400]); }catch(e){}
}
function paintTimer(){
  var left=T.end?Math.max(0,Math.ceil((T.end-Date.now())/1000)):0, panel=$('#timer'), chipEl=$('#tchip');
  if(panel){
    panel.classList.toggle('run',!!T.end); panel.classList.toggle('done',T.done);
    var n=$('#timer-n'); if(n) n.textContent=T.done?'סיום!':clock(left);
    var f=$('#timer-f'); if(f) f.style.width=(T.end&&T.total?left/T.total*100:0)+'%';
  }
  if(chipEl){
    var show=(T.end||T.done)&&!panel;
    chipEl.hidden=!show; chipEl.classList.toggle('done',T.done);
    if(show) chipEl.textContent=T.done?'המנוחה נגמרה':clock(left);
  }
}

/* ---------- persistence ---------- */
var col=null, cloudReady=false, pushing=false, pushAgain=false, saveTimer=null, retryTimer=null, lastPull=0, pulling=false;
function setStatus(s){
  var el=$('#save'); if(!el) return; el.dataset.s=s;
  el.textContent=s==='saving'?'שומר…':s==='saved'?'נשמר ✓':s==='local'?'נשמר במכשיר ✓':'לא נשמר';
}
function loadLocal(){
  try{
    var raw=localStorage.getItem(LS_KEY); if(!raw) return;
    var o=JSON.parse(raw);
    if(o&&typeof o==='object'){
      days={}; if(o.days&&typeof o.days==='object') Object.keys(o.days).forEach(function(k){ if(isDate(k)) days[k]=norm(o.days[k]); });
      meta=normMeta(o.meta);
      dirty=(o.dirty&&typeof o.dirty==='object')?o.dirty:{};
      Object.keys(dirty).forEach(function(k){ if(typeof dirty[k]==='number'&&dirty[k]>seq) seq=dirty[k]; });
    }
  }catch(e){}
}
function saveLocal(){ try{ localStorage.setItem(LS_KEY,JSON.stringify({days:days,meta:meta,dirty:dirty})); return true; }catch(e){ return false; } }
function scheduleSave(){ setStatus('saving'); clearTimeout(saveTimer); saveTimer=setTimeout(flush,500); }
function flush(){
  clearTimeout(saveTimer); saveTimer=null;
  var ok=saveLocal();
  if(cloudReady) pushDirty(); else setStatus(ok?'saved':'error');
}
function pushDirty(){
  if(!cloudReady||!col) return Promise.resolve();
  if(pushing){ pushAgain=true; return Promise.resolve(); }
  pushing=true;
  var failed=false;
  function one(keys,i){
    if(i>=keys.length) return Promise.resolve();
    var key=keys[i], stamp=dirty[key], p;
    try{
      if(key==='meta') p=col.doc('meta').set(clone(meta));
      else{
        var date=key.slice(2), d=days[date];
        if(!isDate(date)){ delete dirty[key]; return one(keys,i+1); }
        if(d){ var body=clone(d); body.d=date; p=col.doc(key).set(body); } else p=col.doc(key).delete();
      }
    }catch(e){ failed=true; return Promise.resolve(); }
    return Promise.resolve(p).then(function(){ if(dirty[key]===stamp) delete dirty[key]; return one(keys,i+1); },function(){ failed=true; });
  }
  function loop(){
    pushAgain=false;
    return one(Object.keys(dirty),0).then(function(){ if(pushAgain&&!failed) return loop(); });
  }
  return loop().then(function(){
    pushing=false; saveLocal();
    if(failed){
      setStatus('local'); clearTimeout(retryTimer);
      retryTimer=setTimeout(function(){ if(Object.keys(dirty).length) pushDirty(); },20000);
    }else if(!saveTimer) setStatus('saved');
  });
}
function withTimeout(p,ms){
  return new Promise(function(res,rej){ var t=setTimeout(function(){ rej(new Error('timeout')); },ms); Promise.resolve(p).then(function(v){ clearTimeout(t); res(v); },function(e){ clearTimeout(t); rej(e); }); });
}
function pullCloud(){
  if(!col||pulling) return Promise.resolve(false);
  pulling=true;
  var cd={}, cm=null;
  function page(last,guard){
    var q=last?col.where('d','>',last):col;
    return q.orderBy('d').limit(500).get().then(function(qs){
      var lastSeen=last;
      qs.docs.forEach(function(s){ var b=s.data(); if(b&&isDate(b.d)){ b=clone(b); var date=b.d; delete b.d; cd[date]=norm(b); lastSeen=date; } });
      if(qs.size>=500&&guard<40&&lastSeen&&lastSeen!==last) return page(lastSeen,guard+1);
    });
  }
  return withTimeout(col.doc('meta').get().then(function(ms){ if(ms.exists) cm=normMeta(clone(ms.data())); return page('',0); }),15000).then(function(){
    var before=JSON.stringify([days,meta]);
    Object.keys(cd).forEach(function(date){
      var local=days[date], cloud=cd[date], key='d_'+date;
      if(!local||(cloud.t||0)>(local.t||0)){ days[date]=cloud; delete dirty[key]; }
      else if((local.t||0)>(cloud.t||0)){ if(!dirty[key]) dirty[key]=++seq; }
    });
    Object.keys(days).forEach(function(date){ if(!cd[date]&&!dirty['d_'+date]) dirty['d_'+date]=++seq; });
    if(cm&&(cm.t||0)>(meta.t||0)){ meta=cm; delete dirty.meta; }
    else if((!cm&&(meta.t||Object.keys(meta.weights).length))||(cm&&(meta.t||0)>(cm.t||0))){ if(!dirty.meta) dirty.meta=++seq; }
    lastPull=Date.now(); pulling=false; saveLocal();
    return JSON.stringify([days,meta])!==before;
  },function(e){ pulling=false; throw e; });
}
function initCloud(){
  if(!window.claude||typeof window.claude.use!=='function') return Promise.resolve();
  return Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
    var db=r[0], user=r[1]; if(!db||!user) return;
    return user.id().then(function(uid){
      if(!uid) return;
      col=db.collection('data/users/'+uid);
      return tryPull(0);
    });
  }).catch(function(){});
}
function tryPull(attempt){
  return pullCloud().then(function(changed){
    cloudReady=true;
    var n=$('#sync-note'); if(n) n.textContent=syncNote();
    if(changed) softRender();
    if(Object.keys(dirty).length) pushDirty(); else if(!saveTimer) setStatus('saved');
  },function(){
    if(attempt<3) setTimeout(function(){ tryPull(attempt+1); },20000*(attempt+1));
  });
}

/* ---------- backup ---------- */
function exportText(){
  var out={}; Object.keys(days).sort().forEach(function(k){ if(hasActivity(days[k])) out[k]=days[k]; });
  return JSON.stringify({app:'keto-strength-tracker',version:1,exportedAt:new Date().toISOString(),days:out,meta:meta},null,2);
}
function bk(msg,err){ ui.bkMsg=msg; ui.bkErr=!!err; }
function isStandalone(){ try{ return navigator.standalone===true||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches); }catch(e){ return false; } }
function doExport(){
  var data=exportText(), name='keto-backup-'+todayStr()+'.json';
  var use=window.claude&&typeof window.claude.use==='function'?window.claude.use('downloads'):Promise.resolve(null);
  Promise.resolve(use).then(function(dl){
    if(dl) return dl.save({filename:name,data:data}).then(function(){ bk('הגיבוי נשמר כקובץ.'); },function(e){
      if(e&&e.code==='declined'){ bk(''); return; }
      ui.bkText=data; bk('לא ניתן לשמור קובץ כאן. אפשר להעתיק את הגיבוי מהתיבה.',true);
    });
    /* Installed on a phone home screen: hand the file to the system share sheet (Save to Files). */
    if(isStandalone()){
      try{
        var file=new File([data],name,{type:'application/json'});
        if(navigator.canShare&&navigator.canShare({files:[file]})) return navigator.share({files:[file]}).then(function(){ bk('הגיבוי נשמר.'); },function(e){
          if(e&&e.name==='AbortError'){ bk(''); return; }
          ui.bkText=data; bk('אפשר להעתיק את הגיבוי מהתיבה.');
        });
      }catch(e){}
      ui.bkText=data; bk('אפשר להעתיק את הגיבוי מהתיבה.'); return;
    }
    try{
      var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type:'application/json'})); a.download=name;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(a.href); },4000);
      bk('ההורדה התחילה. אם לא נשמר קובץ, אפשר להשתמש ב״העתקת הגיבוי״.');
    }catch(e){ ui.bkText=data; bk('אפשר להעתיק את הגיבוי מהתיבה.'); }
  }).catch(function(){ ui.bkText=data; bk('אפשר להעתיק את הגיבוי מהתיבה.'); }).then(function(){ if(ui.tab==='week') render(); });
}
function doCopy(){
  var data=exportText();
  function fallback(){ ui.bkText=data; bk('ההעתקה נחסמה. הגיבוי מוצג בתיבה – אפשר לסמן ולהעתיק.'); render(); var t=$('#bk-text'); if(t){ t.focus(); t.select(); } }
  try{ navigator.clipboard.writeText(data).then(function(){ bk('הגיבוי הועתק.'); render(); },fallback); }catch(e){ fallback(); }
}
function parseImport(text){
  var o; try{ o=JSON.parse(text); }catch(e){ return null; }
  if(!o||typeof o!=='object'||!o.days||typeof o.days!=='object'||Array.isArray(o.days)) return null;
  var out={days:{},meta:normMeta(o.meta&&typeof o.meta==='object'?clone(o.meta):{})};
  Object.keys(o.days).forEach(function(k){ if(isDate(k)&&o.days[k]&&typeof o.days[k]==='object') out.days[k]=norm(clone(o.days[k])); });
  return out;
}
function stageImport(text){
  var o=parseImport(text);
  if(!o){ ui.pendingImport=null; bk('זה לא קובץ גיבוי תקין של היומן.',true); }
  else{ ui.pendingImport=o; bk(''); ui.bkText=''; }
  render();
}
function applyImport(){
  var o=ui.pendingImport; if(!o) return;
  var old=Object.keys(days), now=Date.now();
  days={};
  Object.keys(o.days).forEach(function(k){ var d=o.days[k]; d.t=now; days[k]=d; dirty['d_'+k]=++seq; });
  old.forEach(function(k){ if(!days[k]){ var e=blankDay(); e.t=now; days[k]=e; dirty['d_'+k]=++seq; } });
  meta=o.meta; ui.pendingImport=null; touchMeta();
  bk('הגיבוי נטען.'); render();
}

/* ---------- actions ---------- */
function stamp(d,m){
  if(mealLogged(d,m)&&!d[m].time&&ui.date===todayStr()) d[m].time=nowHM();
}
function setExPref(id,k,v){ if(!meta.ex[id]||typeof meta.ex[id]!=='object') meta.ex[id]={}; meta.ex[id][k]=v; touchMeta(); }
function onAct(el){
  var act=el.dataset.act, v=el.dataset.v, date=ui.date, ex, i;
  switch(act){
    case 'tab': if(ui.tab!==v){ ui.tab=v; ui.delW=null; render(); window.scrollTo(0,0); } return;
    case 'date': ui.date=v; render(); return;
    case 'week': ui.date=addDays(ui.date,Number(v)); render(); return;
    case 'today': ui.date=todayStr(); render(); return;
    case 'goto': ui.date=v; ui.tab='daily'; render(); window.scrollTo(0,0); return;
    case 'jump': var t=$('#sec-workout'); if(t) t.scrollIntoView({behavior:'smooth',block:'start'}); return;
    case 'type': mutate(date,function(d){ d.type=d.type===v?null:v; }); break;
    case 'habit': mutate(date,function(d){ d.habits[v]=!d.habits[v]; }); break;
    case 'scoops': mutate(date,function(d){ var n=Number(v), was=mealLogged(d,'shake'); if(d.shake.scoops==n) d.shake.scoops=null; else{ d.shake.scoops=n; if(!was) d.shake.cream=true; } stamp(d,'shake'); }); break;
    case 'cream': mutate(date,function(d){ d.shake.cream=!d.shake.cream; stamp(d,'shake'); }); break;
    case 'eggs': mutate(date,function(d){ var n=Number(v); d.lunch.eggs=d.lunch.eggs==n?null:n; stamp(d,'lunch'); }); break;
    case 'eggq': mutate(date,function(d){ var n=Math.max(0,Math.min(12,(Number(d.lunch.eggs)||0)+Number(el.dataset.d))); d.lunch.eggs=n||null; stamp(d,'lunch'); }); break;
    case 'side': mutate(date,function(d){ d.lunch.side=d.lunch.side===v?null:v; stamp(d,'lunch'); }); break;
    case 'fadd':
    case 'fq':
      var fm=el.dataset.meal, fd=FOODS[v]; if(!fd||!MEALS_ITEMS[fm]) return;
      mutate(date,function(d){
        var it=d[fm].items[v], q=it?Number(it.q)||0:0;
        q+=act==='fadd'?1:Number(el.dataset.d)*(fd.kg!=null?0.5:1);
        if(q<=0) delete d[fm].items[v];
        else if(it) it.q=Math.min(50,q);
        else d[fm].items[v]=fd.kg!=null?{q:q,g:fd.g}:{q:q};
        stamp(d,fm);
      });
      break;
    case 'snack': mutate(date,function(d){ d.snack.on=!d.snack.on; stamp(d,'snack'); }); break;
    case 'now': mutate(date,function(d){ d[el.dataset.meal].time=nowHM(); }); break;
    case 'time-clear': mutate(date,function(d){ d[el.dataset.meal].time=''; }); break;
    case 'unit':
      ex=EX_BY_ID[el.dataset.ex]; if(!ex) return;
      setExPref(ex.id,'u',v==='lb'?'lb':'kg');
      if(days[date]&&viewDay(date).workout.ex[ex.id]) mutate(date,function(d){ d.workout.ex[ex.id].u=v==='lb'?'lb':'kg'; });
      break;
    case 'bar':
      ex=EX_BY_ID[el.dataset.ex]; if(!ex) return;
      setExPref(ex.id,'bar',Number(v)===15?15:20);
      if(days[date]&&viewDay(date).workout.ex[ex.id]) mutate(date,function(d){ d.workout.ex[ex.id].bar=Number(v)===15?15:20; });
      break;
    case 'incline-add': mutate(date,function(d){ d.workout.incline=(meta.ex.incline&&meta.ex.incline.variant)==='db'?'db':'bb'; }); break;
    case 'incline-remove': mutate(date,function(d){ d.workout.incline=false; }); break;
    case 'incline-var': setExPref('incline','variant',v==='db'?'db':'bb'); mutate(date,function(d){ d.workout.incline=v==='db'?'db':'bb'; }); break;
    case 'setok':
      ex=EX_BY_ID[el.dataset.ex]; i=Number(el.dataset.i); if(!ex||!(i>=0&&i<MAX_SETS)) return;
      var dv=viewDay(date), cur=(dv.workout.ex[ex.id]&&dv.workout.ex[ex.id].sets&&dv.workout.ex[ex.id].sets[i])||{w:'',r:''};
      if(setLogged(cur)) return;
      var ph=placeholders(ex,exUnit(ex,dv),lastSession(ex.id,date),i), w=needsW(ex);
      var wv=cur.w!==''&&cur.w!=null?cur.w:ph.w;
      if(ph.r===''||(w&&wv==='')){
        var target=$((w&&wv==='')?'#w-'+ex.id+'-'+i:'#r-'+ex.id+'-'+i); if(target) target.focus();
        return;
      }
      mutate(date,function(d){ var r=ensureRec(d,ex,i+1); if(w) r.sets[i].w=String(wv); r.sets[i].r=String(ph.r); });
      break;
    case 'set-add':
      ex=EX_BY_ID[el.dataset.ex]; if(!ex) return;
      mutate(date,function(d){ var r=ensureRec(d,ex); if(r.sets.length<MAX_SETS) r.sets.push({w:'',r:''}); });
      break;
    case 'set-del':
      ex=EX_BY_ID[el.dataset.ex]; if(!ex) return;
      mutate(date,function(d){ var r=ensureRec(d,ex); if(r.sets.length>ex.sets) r.sets.pop(); });
      break;
    case 'timer': startTimer(Number(v)); return;
    case 'timer-stop': stopTimer(); return;
    case 'w-save':
      var kg=toNum($('#w-kg').value), wd=$('#w-date').value;
      if(!isDate(wd)){ ui.wMsg='יש לבחור תאריך.'; break; }
      if(!(kg>=30&&kg<=250)){ ui.wMsg='יש להזין משקל בק״ג, למשל 82.4.'; break; }
      ui.wMsg=''; meta.weights[wd]=Math.round(kg*10)/10; ui.wDate=null; touchMeta(); break;
    case 'w-del': ui.delW=v; break;
    case 'w-del-no': ui.delW=null; break;
    case 'w-del-yes': delete meta.weights[v]; ui.delW=null; touchMeta(); break;
    case 'export': doExport(); return;
    case 'copy': doCopy(); return;
    case 'import-yes': applyImport(); return;
    case 'import-no': ui.pendingImport=null; break;
    case 'import-text': stageImport(($('#imp-text')||{}).value||''); return;
    default: return;
  }
  render();
}
function paintSet(ex,i){
  var d=viewDay(ui.date), rec=d.workout.ex[ex.id], s=(rec&&rec.sets&&rec.sets[i])||{w:'',r:''};
  var ok=$('#ok-'+ex.id+'-'+i); if(ok) ok.setAttribute('aria-pressed',String(setLogged(s)));
  var hb=$('#h-'+ex.id+'-'+i);
  if(hb&&needsW(ex)){
    var unit=exUnit(ex,d), ph=placeholders(ex,unit,lastSession(ex.id,ui.date),i), h=hintHtml(ex,unit,exBar(ex,d),s.w,ph.w);
    hb.innerHTML=h.html; hb.classList.toggle('ph',h.ph);
  }
}
function onInput(el){
  var kind=el.dataset.in, date=ui.date;
  if(kind==='time'){ mutate(date,function(d){ d[el.dataset.meal].time=el.value||''; }); updateSummary(); }
  else if(kind==='fgrams'){
    var fm=el.dataset.meal, fid=el.dataset.food, fd=FOODS[fid]; if(!fd||!MEALS_ITEMS[fm]) return;
    var dd=mutate(date,function(d){ var it=d[fm].items[fid]; if(it){ var n=toNum(el.value); it.g=isNaN(n)?0:Math.max(0,Math.min(3000,n)); } });
    var sub=$('#fk-'+fm+'-'+fid); if(sub&&dd[fm].items[fid]) sub.innerHTML=foodSub(fd,dd[fm].items[fid]);
    updateSummary();
  }
  else if(kind==='fqty'){
    var qm=el.dataset.meal, qid=el.dataset.food, qf=FOODS[qid]; if(!qf||!MEALS_ITEMS[qm]) return;
    var qn=toNum(el.value); qn=isNaN(qn)?0:Math.max(0,Math.min(50,Math.round(qn)));
    mutate(date,function(d){ if(qn>0) d[qm].items[qid]={q:qn}; else delete d[qm].items[qid]; stamp(d,qm); });
    var qs=$('#fk-'+qm+'-'+qid); if(qs) qs.innerHTML=foodSub(qf,{q:qn});
    updateSummary(); pendingRender=true;
  }
  else if(kind==='notes'){ mutate(date,function(d){ d.notes=String(el.value).slice(0,600); }); updateSummary(); }
  else if(kind==='set'){
    var ex=EX_BY_ID[el.dataset.ex], i=Number(el.dataset.i), f=el.dataset.f==='w'?'w':'r'; if(!ex||!(i>=0&&i<MAX_SETS)) return;
    mutate(date,function(d){ var r=ensureRec(d,ex,i+1); r.sets[i][f]=String(el.value).slice(0,8); });
    paintSet(ex,i); updateSummary();
  }
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest?e.target.closest('[data-act]'):null;
  if(el&&el.closest('#app')) onAct(el);
});
document.addEventListener('input',function(e){ var el=e.target; if(el&&el.dataset&&el.dataset.in) onInput(el); });
document.addEventListener('change',function(e){
  var el=e.target; if(!el) return;
  if(el.id==='w-date'){ if(isDate(el.value)){ ui.wDate=el.value; var k=$('#w-kg'); if(k) k.placeholder=meta.weights[el.value]?Number(meta.weights[el.value]).toFixed(1):BASE_KG.toFixed(1); } }
  else if(el.id==='imp-file'){
    var f=el.files&&el.files[0]; if(!f) return;
    var fr=new FileReader();
    fr.onload=function(){ stageImport(String(fr.result||'')); };
    fr.onerror=function(){ bk('לא ניתן לקרוא את הקובץ.',true); render(); };
    fr.readAsText(f);
  }
});
document.addEventListener('keydown',function(e){
  var el=e.target; if(!el) return;
  if(e.key==='Enter'&&el.id==='w-kg'){ e.preventDefault(); var b=$('[data-act="w-save"]'); if(b) b.click(); }
  if((e.key==='Enter'||e.key===' ')&&el.matches&&el.matches('label[for="imp-file"]')){ e.preventDefault(); var fi=$('#imp-file'); if(fi) fi.click(); }
});
document.addEventListener('focusout',function(){ setTimeout(function(){ if(pendingRender&&!isEditing()) render(); },0); });
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='hidden'){ if(saveTimer) flush(); }
  else{
    paintTimer();
    if(cloudReady&&!saveTimer&&!pushing&&Date.now()-lastPull>60000){
      pullCloud().then(function(changed){ if(changed) softRender(); if(Object.keys(dirty).length) pushDirty(); },function(){});
    }
  }
});
window.addEventListener('pagehide',function(){ if(saveTimer) flush(); });

/* ---------- boot ---------- */
loadLocal();
render();
initCloud();
})();
</script>

<script>
if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
</script>
